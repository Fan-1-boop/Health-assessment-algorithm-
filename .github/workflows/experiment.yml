name: V1 reproducible SMAP experiment
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_v1.py --generations 5
      - name: Upload metrics as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: smap-p1-v1-results
          path: results/
      - name: Commit reproducible metrics and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/metrics.json results/RESULTS.md results/heldout_predictions.csv results/simulated_feedback.jsonl
          git diff --cached --quiet || (git commit -m 'results: executed SMAP P-1 V1 experiment' && git push)
