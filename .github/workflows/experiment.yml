name: V1 reproducible SMAP experiment (manual / legacy)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_v1.py --generations 5
      - uses: actions/upload-artifact@v4
        with:
          name: smap-p1-v1-results
          path: results/
