name: Real OPS-SAT high-dimensional MSF cost-quality audit
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - .github/workflows/opssat_highdim_msf.yml
  workflow_dispatch:
jobs:
  highdim:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install matplotlib joblib requests
      - name: Validate 2560-dimensional per-segment feature construction
        run: python -m pytest -q research/highdim_opssat/test_benchmark.py
      - name: Engineer from authentic raw segments and measure full/MSF/Fisher costs
        run: |
          python -u research/highdim_opssat/benchmark.py --out results/highdim_opssat
      - name: Archive measured reports and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-sat-highdim-feature-cost-quality
          path: results/highdim_opssat/
          if-no-files-found: warn
      - name: Commit verified results to research branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/highdim_opssat/
          git commit -m 'results(research): actual raw OPS-SAT 2578D feature efficiency vs MSF/Fisher' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for i in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
