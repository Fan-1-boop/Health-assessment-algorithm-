name: V1.4 ESA official-ID and alarms
on:
  push:
    paths:
      - .github/workflows/v14_esa.yml
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --quiet 'numpy>=1.24,<3' 'scipy>=1.10' 'scikit-learn>=1.3' 'pandas>=2.0' 'remotezip>=0.12' 'pytest>=8'
      - name: Unit test official-ID partition and frozen alert policy
        run: |
          python -m pytest -q tests/test_v14.py tests/test_v13.py tests/test_esa_remote_subset.py
      - name: Fetch official catalog and new channel_21 without full ZIP download
        run: |
          mkdir -p data/esa_v14_channel21 results/v14/esa_channel_21
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from remotezip import RemoteZip
          from fetch_esa_remote_subset import source_metadata, fetch_and_write, ESA_URL
          from pathlib import Path
          with RemoteZip(ESA_URL,timeout=105,initial_buffer_size=1024*512) as rz:
              catalog=source_metadata(rz)
              catalog.to_csv('data/esa_v14_channel21/mission1_event_catalog.csv',index=False)
              output,audit=fetch_and_write(rz,Path('data/esa_v14_channel21'),channel='channel_21',min_events=9,resample='10min')
              print('Official source event IDs:',catalog.ID.nunique(),'new channel rows:',audit['resampled_sample_count'])
          PY
      - name: Evaluate three fixed baselines with an ID-safe event split
        run: |
          python scripts/run_v14_esa.py \
            --csv data/esa_v14_channel21/channel_21.csv \
            --catalog data/esa_v14_channel21/mission1_event_catalog.csv \
            --channel channel_21 \
            --out results/v14/esa_channel_21
      - name: Upload reports even if evaluation fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-esa-channel21-official-id-study
          path: |
            results/v14/
            data/esa_v14_channel21/extraction_manifest.json
            data/esa_v14_channel21/mission1_event_catalog.csv
          if-no-files-found: warn
      - name: Commit verified source-data subset and experimental outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/esa_v14_channel21/channel_21.csv data/esa_v14_channel21/mission1_event_catalog.csv data/esa_v14_channel21/extraction_manifest.json results/v14/esa_channel_21/metrics.json
          git commit -m 'data(results): V1.4 new ESA channel21 official-ID test and frozen alarm policy' || exit 0
          git push origin HEAD:main
