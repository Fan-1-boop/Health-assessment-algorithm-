name: One-dataset synthetic satellite health MVP
on:
  push:
    paths:
      - '.github/workflows/mvp_synthetic.yml'
  workflow_dispatch:
jobs:
  mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib
      - name: Verify frozen data generator and score mapping
        run: python -m pytest -q mvp/test_mvp.py
      - name: Train and evaluate end-to-end MVP once
        run: python mvp/run.py --out results/mvp
      - name: Artifact capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-health-single-dataset-mvp
          path: results/mvp/
          if-no-files-found: warn
      - name: Push source-data, predictions, saved model and numeric results
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/mvp/
          git commit -m 'results(mvp): deterministic full synthetic health demo and model artifacts' || exit 0
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
