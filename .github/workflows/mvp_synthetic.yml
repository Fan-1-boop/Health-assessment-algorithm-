name: One-dataset synthetic satellite health MVP
on:
  push:
    paths:
      - '.github/workflows/mvp_synthetic.yml'
      - 'mvp/**'
  workflow_dispatch:
jobs:
  mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib
      - name: Verify frozen data generator and score mapping
        run: python -m pytest -q mvp/test_mvp.py
      - name: Train and evaluate end-to-end MVP once
        run: python mvp/run.py --out results/mvp
      - name: Verify saved model can predict without refitting
        run: |
          python mvp/predict.py --input results/mvp/synthetic_satellite_telemetry.csv --model results/mvp/model_bundle.joblib --mission 3 --out results/mvp/inference_reloaded.csv
          python - <<'PY'
          import pandas as pd,numpy as np
          demo=pd.read_csv('results/mvp/demo_predictions.csv')
          loaded=pd.read_csv('results/mvp/inference_reloaded.csv')
          assert len(demo)==len(loaded)
          cols=['p_healthy','p_degraded','p_fault','p_anomaly','health_score_predicted','state_predicted','anomaly_flag']
          for c in cols:
              assert np.allclose(demo[c],loaded[c],rtol=1e-9,atol=1e-9), c
          print('MODEL_RELOAD_MATCH: all',len(loaded),'held-out predictions agree with initial experiment.')
          PY
      - name: Artifact capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-health-single-dataset-mvp
          path: results/mvp/
          if-no-files-found: warn
      - name: Push source-data, predictions, saved model and numeric results
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/mvp/
          git commit -m 'results(mvp): deterministic full synthetic health demo and model artifacts' || exit 0
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
