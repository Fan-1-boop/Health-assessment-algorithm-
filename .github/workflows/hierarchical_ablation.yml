name: Synthetic hierarchical vs direct 3-state classifier
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - '.github/workflows/hierarchical_ablation.yml'
  workflow_dispatch:
jobs:
  run_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible analysis runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install matplotlib joblib
      - name: Check multinomial calibration and temporal-metric invariants
        run: python -m pytest -q research/hierarchical_ablation/test_benchmark.py
      - name: Run frozen three-state model comparison
        run: python -u research/hierarchical_ablation/benchmark.py --out results/hierarchical_ablation
      - name: Archive metrics and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-hierarchical-multinomial-ablation
          path: results/hierarchical_ablation/
          if-no-files-found: warn
      - name: Commit study results to research branch only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/hierarchical_ablation/
          git commit -m 'results(research): synthetic hierarchy vs direct 3-state F1 Brier compute comparison' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for n in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
