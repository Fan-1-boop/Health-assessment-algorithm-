name: Real OPS-SAT final-prep fixed-budget update robustness
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - '.github/workflows/opssat_final_prep.yml'
  workflow_dispatch:
jobs:
  single_dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies and plots
        run: |
          python -m pip install -r requirements.txt
          python -m pip install matplotlib joblib requests
      - name: Validate fixed-budget real anomaly protocol
        run: |
          python -m pytest -q research/opssat_final_prep/test_benchmark.py
          python -m pytest -q research/hitl_update/test_gate.py
      - name: Run 2578-feature real OPS-SAT update label-corruption controls
        run: |
          python -u research/opssat_final_prep/benchmark.py --out results/opssat_final_prep
      - name: Upload analysis before any GitHub commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-opssat-64budget-supervised-update-preacceptance
          path: results/opssat_final_prep/
          if-no-files-found: warn
      - name: Commit ordinary baseline only to research branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/opssat_final_prep/
          git commit -m 'results(research): real OPS-SAT max64 feature-budget supervised label quality robustness baseline' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for n in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
