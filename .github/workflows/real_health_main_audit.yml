name: Audit OPS-SAT raw time and label semantics for real HMM research
on:
  push:
    branches: [research/hitl-quality-gated-update]
    paths: ['.github/workflows/real_health_main_audit.yml']
  workflow_dispatch:
jobs:
  original_train_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pandas requests
      - run: python -u research/real_health_main/audit_labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-OPS-SAT-point-label-semantics-audit
          path: results/real_health_main/raw_label_feasibility.json
          if-no-files-found: warn
      - name: Store evidence exclusively on research branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real_health_main/raw_label_feasibility.json
          git commit -m 'results(research): real source annotation granularity and timestamp feasibility' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for i in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
