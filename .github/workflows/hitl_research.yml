name: Human-labeled update research baseline
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - research/hitl_update/**
      - .github/workflows/hitl_research.yml
  workflow_dispatch:
jobs:
  test_and_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib
      - name: Unit test supervised-only upload gate
        run: |
          python -m pytest -q research/hitl_update/test_gate.py
      - name: Public non-novel A/B/C pilot on previously labeled real satellite training split
        run: |
          python research/hitl_update/ablation.py --out results/hitl_public_pilot
      - name: Archive all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-reviewed-supervised-update-public-pilot
          path: results/hitl_public_pilot/
          if-no-files-found: warn
      - name: Commit demonstration metrics to research branch only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/hitl_public_pilot/
          git commit -m 'results(research): supervised-only update A-B-C public baseline demo' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for attempt in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
