name: Synthetic health HMM and fusion module audit
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - '.github/workflows/state_hmm_ablation.yml'
  workflow_dispatch:
jobs:
  simulated_state_ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen MVP dependencies and plotting
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib matplotlib
      - name: Verify causal state delay and rolling baseline tests
        run: |
          python -m pytest -q research/state_hmm_ablation/test_run.py
      - name: Reload original trained simulation model and run prespecified diagnostics
        run: |
          python -u research/state_hmm_ablation/run.py --out results/state_hmm_ablation
      - name: Upload reproducible metrics and visualizations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-state-hmm-fusion-module-audit
          path: results/state_hmm_ablation/
          if-no-files-found: warn
      - name: Commit diagnostic artifacts to research branch only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/state_hmm_ablation/
          git commit -m 'results(research): simulate static/HMM/fusion F1, Brier, delays and inference cost' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for attempt in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
