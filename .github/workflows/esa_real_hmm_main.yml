name: ESA continuous real HMM health-main ablation
on:
  push:
    branches: [research/hitl-quality-gated-update]
    paths: ['.github/workflows/esa_real_hmm_main.yml']
  workflow_dispatch:
jobs:
  three_channel_real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install numerical dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pandas scipy scikit-learn numpy
      - name: Verify time-causality, state probability and reset invariants
        run: python -m pytest -q research/esa_real_hmm_main/test_benchmark.py
      - name: Run previously exposed but genuine ESA Mission1 event-ID-based real experiment
        run: |
          python -u research/esa_real_hmm_main/benchmark.py --out results/real_esa_health_hmm
      - name: Archive source-derived results even if experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESA-Mission1-real-continuous-health-HMM-E1
          path: results/real_esa_health_hmm/
          if-no-files-found: warn
      - name: Commit results only to research branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real_esa_health_hmm/
          git commit -m 'results(research): real ESA 3channel HMM engineering-risk ablation vs static EMA' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for i in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
