name: Real OPS-SAT chronological within-segment HMM main + anomaly assistance
on:
  push:
    branches: [research/hitl-quality-gated-update]
    paths: ['.github/workflows/real_health_main.yml']
  workflow_dispatch:
jobs:
  real_health_e1_e3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install real numerical runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install matplotlib requests
      - name: Test causal-time and real-label inference invariants
        run: python -m pytest -q research/real_health_main/test_benchmark.py
      - name: Run real chronological OPS-SAT main/auxiliary ablations
        run: |
          python -u research/real_health_main/benchmark.py --out results/real_health_main
      - name: Archive real output and protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ops-sat-initialized-risk-hmm-and-auxiliary-anomaly
          path: results/real_health_main/
          if-no-files-found: warn
      - name: Commit real-data outcomes to research branch only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real_health_main
          git commit -m 'results(research): real within-segment HMM risk baseline and auxiliary objective anomaly fusion' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for n in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
