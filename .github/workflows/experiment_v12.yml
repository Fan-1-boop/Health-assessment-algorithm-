name: V1.2 independent-branch experiment
on:
  push:
    branches: [main]
    paths:
      - 'src/independent_branches.py'
      - 'scripts/run_v12.py'
      - 'tests/test_v12.py'
      - '.github/workflows/experiment_v12.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-v12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check code and leakage safeguards
        run: pytest -q
      - name: Run independent branches without fusion
        run: python scripts/run_v12.py --generations 5 --population 12
      - uses: actions/upload-artifact@v4
        with:
          name: smap-p1-v12-independent-branches
          path: results/v12/
      - name: Commit and preserve raw numeric experiment outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v12/metrics.json results/v12/RESULTS.md results/v12/heldout_predictions.csv
          git diff --cached --quiet || (git commit -m 'results: V1.2 independent state and anomaly branch evaluation' && git push)
