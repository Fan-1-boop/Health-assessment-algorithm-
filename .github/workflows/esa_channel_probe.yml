name: ESA Mission1 channel format probe
on:
  push:
    paths:
      - .github/workflows/esa_channel_probe.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet remotezip pandas zstandard
      - name: Inspect channels compression and source event IDs
        shell: bash
        run: |
          python - <<'PY'
          import io,pandas as pd,collections
          from remotezip import RemoteZip
          url='https://zenodo.org/records/15237121/files/ESA-Mission1.zip?download=1'
          with RemoteZip(url,timeout=90,initial_buffer_size=512*1024) as z:
            sample=['ESA-Mission1/labels.csv','ESA-Mission1/anomaly_types.csv','ESA-Mission1/channels.csv',
                    'ESA-Mission1/channels/channel_41.zip','ESA-Mission1/channels/channel_21.zip',
                    'ESA-Mission1/channels/channel_12.zip']
            for n in sample:
              inf=z.getinfo(n)
              print('ZIP_ENTRY',n,'compress_type',inf.compress_type,
                    'compressed_bytes',inf.compress_size,'uncompressed_bytes',inf.file_size,flush=True)
              if inf.file_size>100*1024*1024:continue
              try:
                data=z.read(n)
                print('READ_OK',n,'actual_bytes',len(data),flush=True)
                if n.endswith('.zip'):
                  try:
                    frame=pd.read_pickle(io.BytesIO(data),compression='zip')
                    print('CHANNEL_FRAME',n,frame.shape,str(frame.index.dtype),frame.head(2).to_string(),flush=True)
                  except Exception as e:print('NESTED_READ_FAILED',repr(e),flush=True)
              except Exception as e:print('READ_FAILED',n,repr(e),flush=True)
            labels=pd.read_csv(io.BytesIO(z.read('ESA-Mission1/labels.csv')))
            typ=pd.read_csv(io.BytesIO(z.read('ESA-Mission1/anomaly_types.csv')))
            merged=labels.merge(typ[['ID','Category']],on='ID',how='left')
            print('CATEGORY_COUNTS',merged.groupby('Category').agg(rows=('ID','size'),event_ids=('ID','nunique')).to_string(),flush=True)
            for c in ['channel_41','channel_21','channel_12']:
              s=merged[merged.Channel==c]
              print('CHANNEL_EVENTS',c,s.groupby('Category').agg(rows=('ID','size'),events=('ID','nunique')).to_string(),flush=True)
          PY