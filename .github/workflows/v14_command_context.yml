name: V1.4 exploratory telecommand context ablation
on:
  push:
    paths:
      - .github/workflows/v14_command_context.yml
  workflow_dispatch:
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and regression tests
        run: |
          python -m pip install --quiet numpy scipy scikit-learn pandas remotezip zipfile64 pytest
          python -m pytest -q tests/test_v14_context.py tests/test_v14.py
      - name: Fetch commands independently from labels
        run: |
          python scripts/extract_esa_commands.py \
            --telemetry data/esa_v14_channel21/channel_21.csv \
            --channel channel_21 \
            --out data/esa_v14_channel21 \
            --count 8
      - name: Same-data forecasting ablation, diagnostic only
        run: |
          python scripts/run_v14_command_ablation.py \
            --csv data/esa_v14_channel21/channel_21.csv \
            --catalog data/esa_v14_channel21/mission1_event_catalog.csv \
            --commands data/esa_v14_channel21/command_pulses.csv \
            --channel channel_21 \
            --out results/v14/command_context
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esa-command-context-exploratory
          path: |
            results/v14/command_context/
            data/esa_v14_channel21/command_manifest.json
          if-no-files-found: warn
      - name: Commit command context source and exploratory metrics
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/esa_v14_channel21/command_pulses.csv data/esa_v14_channel21/command_manifest.json results/v14/command_context/metrics.json
          git commit -m 'data(results): causal ESA command-context diagnostic ablation' || exit 0
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
