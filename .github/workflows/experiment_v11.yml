name: V1.1 frozen-proxy high-dimensional study (manual / legacy)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/export_proxy_labels.py
      - run: python scripts/run_v11.py --generations 5 --population 12
      - uses: actions/upload-artifact@v4
        with:
          name: smap-p1-v11-results
          path: results/v11/
