name: Single-dataset MSF feature efficiency tradeoff
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - .github/workflows/msf_tradeoff.yml
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quantitative runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install matplotlib joblib
      - name: Run correctness tests
        run: python -m pytest -q research/feature_tradeoff/test_benchmark.py
      - name: Run pre-registered OPS-SAT feature count / compute / quality pilot
        run: |
          python research/feature_tradeoff/benchmark.py --out results/feature_tradeoff
      - name: Publish reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-efficiency-ops-sat-v01
          path: results/feature_tradeoff/
          if-no-files-found: warn
      - name: Commit timing and charts to research branch only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/feature_tradeoff/
          git commit -m 'results(research): measured single OPS-SAT Pareto tradeoffs for MSF feature count and F1' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for attempt in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
