name: Phase-disjoint simulated update and exact rollback
# Test assertions use exact gate field names; see research/isolated_update_rollback/test_run.py.
on:
  push:
    branches:
      - research/hitl-quality-gated-update
    paths:
      - '.github/workflows/isolated_update_rollback.yml'
  workflow_dispatch:
jobs:
  strict_holdouts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib matplotlib
      - name: Run new rollback and original label gate tests
        run: |
          python -m pytest -q research/isolated_update_rollback/test_run.py
          python -m pytest -q research/hitl_update/test_gate.py
      - name: Run cycle-isolated simulated update, negative label/fusion faults, audit
        run: |
          python -u research/isolated_update_rollback/run.py --out results/isolated_update_rollback
      - name: Preserve model quality and actual negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strictly-disjoint-simulated-human-update-and-rollback
          path: results/isolated_update_rollback/
          if-no-files-found: warn
      - name: Commit verified results to research branch only
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/isolated_update_rollback/
          git commit -m 'results(research): isolate state calibration and verify simulated candidate rollback' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for n in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
