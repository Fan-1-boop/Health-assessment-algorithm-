name: ESA real observation innovation HMM E2 frozen ablation
# Rerun repo-root import correction; both independent test suites already passed, numerical protocol unchanged.
on:
  push:
    branches: [research/hitl-quality-gated-update]
    paths: ['.github/workflows/esa_observation_e2.yml']
  workflow_dispatch:
jobs:
  real_esa_e2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project numerical dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install scipy pandas numpy scikit-learn
      - name: Check real-risk protocol constraints, causality and nominal ranks
        run: |
          python -m pytest -q research/esa_observation_e2/test_benchmark.py
          python -m pytest -q research/esa_observation_e2/test_failure_diagnostic.py
          python -m pytest -q research/esa_real_hmm_main/test_benchmark.py
      - name: Run 3-channel real E2 innovation and HMM ablation
        run: |
          python -u research/esa_observation_e2/benchmark.py --out results/esa_observation_e2
      - name: Audit pre-frozen test event non-detection without modifying thresholds or re-fitting
        run: |
          python -u research/esa_observation_e2/failure_diagnostic.py --result-dir results/esa_observation_e2
      - name: Archive complete exploratory evidence even if job fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ESA-threechannel-real-innovation-and-HMM-E2
          path: results/esa_observation_e2/
          if-no-files-found: warn
      - name: Commit only to research branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/esa_observation_e2/
          git commit -m 'results(research): real ESA normal-reference level innovation trend vs HMM ablation' || exit 0
          git fetch origin research/hitl-quality-gated-update
          git rebase origin/research/hitl-quality-gated-update
          for n in 1 2 3; do
            if git push origin HEAD:research/hitl-quality-gated-update; then exit 0; fi
            git fetch origin research/hitl-quality-gated-update
            git rebase origin/research/hitl-quality-gated-update
          done
          exit 1
