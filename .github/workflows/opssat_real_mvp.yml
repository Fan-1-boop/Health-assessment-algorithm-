name: Real OPS-SAT anomaly classification MVP
on:
  push:
    paths:
      - '.github/workflows/opssat_real_mvp.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and dataset dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install joblib requests
      - name: Test OPS-SAT feature isolation and binary classifier contract
        run: python -m pytest -q real_mvp/test_real_mvp.py
      - name: Download authentic OPS-SAT data and execute official holdout evaluation
        run: python real_mvp/run.py --out results/real_ops_sat
      - name: Verify frozen model reload predictions exactly match official holdout
        run: |
          python real_mvp/predict.py \
            --input results/real_ops_sat/dataset.csv \
            --model results/real_ops_sat/model_bundle.joblib \
            --official-test-only \
            --out results/real_ops_sat/reload_predictions.csv
          python - <<'PY'
          import pandas as pd, numpy as np
          first=pd.read_csv('results/real_ops_sat/test_predictions.csv')
          reload=pd.read_csv('results/real_ops_sat/reload_predictions.csv')
          assert len(first)==len(reload)==529
          assert np.array_equal(first.segment,reload.segment)
          for col in ('anomaly_probability','predicted_anomaly',
                      'demonstration_normality_index_not_physical_health'):
              assert np.allclose(first[col],reload[col],atol=1e-11,rtol=1e-11),col
          print('PASS: all 529 official test segment probabilities exactly reproducible.')
          PY
      - name: Archive all real-data results even when upload fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ops-sat-msf-mofs-mvp
          path: results/real_ops_sat/
          if-no-files-found: warn
      - name: Commit verified source, trained model, and evaluation report
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real_ops_sat/
          git commit -m 'results(real-mvp): official OPS-SAT binary anomaly holdout performance' || exit 0
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
